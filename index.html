<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة بايثون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --ink:#13233F; --muted:#5A6A85; --line:#D9E1EE;
  --blue:#2F5FA8; --blue-soft:#E4EDFA; --yellow:#F5C518; --yellow-soft:#FFF4CC;
  --code-bg:#13233F; --code-ink:#E8EEF9; --code-key:#FFD760; --code-str:#8FD3A4; --code-num:#7DB5FF; --code-com:#8A9BB8;
  --ok:#1E8A55; --ok-soft:#E0F5EA; --bad:#B3372B; --bad-soft:#FBE7E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#16233A; --ink:#E8EEF9; --muted:#9AABC7; --line:#263654;
    --blue:#7DB5FF; --blue-soft:#1B2E4D; --yellow-soft:#3A3213;
    --code-bg:#0A1220; --ok:#5FD399; --ok-soft:#153526; --bad:#FF8D80; --bad-soft:#3C1C19;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#16233A; --ink:#E8EEF9; --muted:#9AABC7; --line:#263654;
  --blue:#7DB5FF; --blue-soft:#1B2E4D; --yellow-soft:#3A3213;
  --code-bg:#0A1220; --ok:#5FD399; --ok-soft:#153526; --bad:#FF8D80; --bad-soft:#3C1C19;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.8;font-size:17px}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
button{font-family:inherit}

/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 10px}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;line-height:1.3}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue) 50%,var(--yellow) 50%);flex:0 0 auto}
.bar-r{display:flex;align-items:center;gap:8px}
.pts{background:var(--yellow);color:#13233F;font-weight:700;border-radius:999px;padding:4px 14px;font-size:15px;white-space:nowrap}
.theme{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;color:var(--muted);font-size:16px;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--yellow)}

h1,h2,h3{line-height:1.35;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.muted{color:var(--muted)}
.btn{display:inline-block;background:var(--yellow);color:#13233F;border:0;border-radius:12px;padding:11px 22px;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* home */
.welcome{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.welcome h1{font-size:clamp(26px,5vw,38px);margin-bottom:6px}
.next{background:var(--code-bg);color:var(--code-ink);border:0}
.next .muted{color:var(--code-com)}
.next h3{font-size:22px;margin:4px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px 8px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:14px;color:var(--muted)}
.bars{display:grid;gap:14px}
.lv-row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.track{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.weekbox{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* course */
.level{margin-bottom:26px}
.level-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.level-h h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.ls{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:17px;cursor:pointer;display:grid;place-items:center;position:relative}
.ls small{position:absolute;bottom:2px;font-size:10px;font-weight:400;color:var(--muted)}
.ls.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ls.cur{border-color:var(--blue);background:var(--blue-soft)}
.ls.lock{opacity:.45;cursor:not-allowed}

/* plan */
.mtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}
.mt{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;font-size:15px}
.mt[aria-selected="true"]{background:var(--blue-soft);border-color:var(--blue);font-weight:600}
.week{margin-bottom:14px}
.week.now{border-color:var(--yellow);border-width:2px}
.week-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.week-h h3{font-size:18px}
.badge{font-size:13px;border-radius:999px;padding:2px 12px;background:var(--yellow-soft)}
.wl{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;color:var(--ink);font-size:16px;cursor:pointer}
.wl:first-of-type{border-top:0}
.wl .day{font-size:13px;color:var(--muted);width:64px;flex:0 0 auto}
.wl .st{margin-inline-start:auto;font-size:14px}
.wl.lock{opacity:.5;cursor:not-allowed}
.wl.done .st{color:var(--ok)}
.startrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.startrow input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* lesson */
.crumb{font-size:14px;color:var(--muted);margin-bottom:6px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
.lesson h2{font-size:28px;margin-bottom:8px}
.lesson p{margin:0 0 16px;max-width:60ch}
pre.code{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);font-family:"Fira Code",ui-monospace,Consolas,monospace;font-size:15px;line-height:1.7;border-radius:12px;padding:16px 18px;margin:0;overflow-x:auto;white-space:pre}
.k{color:var(--code-key)}.s{color:var(--code-str)}.n{color:var(--code-num)}.c{color:var(--code-com)}
.outlbl{font-size:13px;color:var(--muted);margin:14px 0 6px}
pre.result{direction:ltr;text-align:left;margin:0;background:var(--yellow-soft);color:var(--ink);font-family:"Fira Code",ui-monospace,Consolas,monospace;font-size:15px;border-radius:12px;padding:12px 18px;border-right:5px solid var(--yellow);overflow-x:auto;white-space:pre-wrap}
.quiz{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.quiz h3{font-size:19px;margin-bottom:10px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{text-align:right;background:var(--bg);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;min-height:28px;font-weight:500}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}

/* toast */
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

footer{padding:34px 0 46px;color:var(--muted);font-size:14px;text-align:center}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer}

@media (max-width:720px){
  .welcome{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lesson{padding:20px 16px}
  .brand{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>رحلة بايثون</div>
    <div class="bar-r">
      <span class="pts" id="ptsChip">0 نقطة</span>
      <button class="theme" id="themeBtn" type="button">الوضع الليلي</button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="home" type="button">الرئيسية</button>
    <button class="tab" role="tab" data-v="course" type="button">الدروس</button>
    <button class="tab" role="tab" data-v="plan" type="button">الخطة</button>
  </div>
  <main id="main"></main>
  <footer>التقدم بيتحفظ في متصفحك. <button class="reset" id="resetBtn" type="button">ابدأ من جديد</button></footer>
</div>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
/* ===== دروس الكورس: [العنوان، الشرح، الكود، النتيجة، السؤال، الاختيارات، رقم الإجابة الصح] ===== */
var L=[
/* ---------- المستوى 1: مبتدئ ---------- */
["أول برنامج: print","الأمر print بيطبع أي كلام بين علامتي تنصيص على الشاشة.",
`print("Hello")

`# ده تعليق
print("مرحبا")  # وده تعليق كمان`,"مرحبا","أي علامة بتبدأ بيها التعليق؟",["#","//","--","/*"],0],

`x = 10
name = "سارة"
print(x)
print(name)`,"10\nسارة","إيه معنى x = 5 ؟",["نحط 5 في المتغير x","نقارن x بـ 5","نطبع 5","نعرّف دالة"],0],
["أسماء المتغيرات","اسم المتغير بيبدأ بحرف أو _ ومايبدأش برقم ومافيهوش مسافات. بايثون بتفرّق بين الحروف الكبيرة والصغيرة.",
`first_name = "علي"
age2 = 21
print(first_name, age2)`,"علي 21","أي اسم متغير غلط؟",["my_var","_x","2x","x2"],2],
["الأرقام","فيه نوعين أساسيين للأرقام: صحيحة int زي 7، وعشرية float زي 2.5.",
`a = 7
b = 2.5
print(a + b)`,"9.5","إيه نوع الرقم 3.14 ؟",["int","float","str","bool"],1],
["العمليات الحسابية","بنستخدم + للجمع و - للطرح و * للضرب و / للقسمة. القسمة بترجّع دايمًا رقم عشري.",

["القسمة الصحيحة والباقي","// بتدّيك ناتج القسمة من غير الكسر، و % بتدّيك الباقي. الباقي مفيد لمعرفة الزوجي والفردي.",
`print(17 // 5)
print(17 % 5)`,"3\n2","ناتج 20 % 6 ؟",["3","2","4","0"],1],
["الأُس","العلامة ** بترفع الرقم لأُس. ولو رفعته لـ 0.5 بتجيب الجذر التربيعي.",
`print(2 ** 3)
print(9 ** 0.5)`,"8\n3.0","ناتج 3 ** 2 ؟",["6","9","5","32"],1],
["النصوص","النص (string) هو أي كلام بين تنصيص. كل حرف له رقم مكان بيبدأ من 0، والسالب بيعدّ من الآخر.",
`s = "Python"
print(s[0])
print(s[-1])
print(len(s))`,"P\nn\n6",`لو s = "abc" إيه قيمة s[1] ؟`,["a","b","c","خطأ"],1],

`print("ha" + "ha")
print("ab" * 3)`,"haha\nababab",`ناتج "x" * 4 ؟`,["xxxx","x4","4x","خطأ"],0],
["f-strings","لو كتبت حرف f قبل النص، تقدر تحط المتغيرات جواه بين { }. ده أسهل طريقة لتركيب الجمل.",

["إدخال من المستخدم: input","الدالة input بتسأل المستخدم وتستنى إجابته، وبترجّعها دايمًا كنص.",
`name = input("اسمك؟ ")
print("أهلاً", name)`,"اسمك؟ علي\nأهلاً علي","input بترجّع القيمة كنوع…",["str (نص)","int","float","bool"],0],

print(x == 5)

if g >= 90:
    print("A")
elif g >= 80:
    print("B")
else:
    print("C")`,"B","كام elif ينفع نستخدم في if واحدة؟",["أي عدد","واحدة بس","اتنين بس","صفر"],0],

["الحلقة while","while بتكرر الكود طول ما الشرط صح. لازم حاجة تغيّر الشرط في الآخر وإلا الحلقة مش هتقف.",

/* ===== إعدادات المستويات والنقاط ===== */
var LEVELS=[
 {n:"المستوى 1: مبتدئ",pts:10},
 {n:"المستوى 2: أساسي",pts:15},
 {n:"المستوى 3: متوسط",pts:20},
 {n:"المستوى 4: متقدم",pts:25},
 {n:"المستوى 5: محترف",pts:30}
];
var RANKS=[[0,"مستجد"],[100,"دارس"],[400,"مبرمج ناشئ"],[900,"مبرمج"],[1500,"مبرمج محترف"],[2000,"خبير بايثون"]];
var PER_WEEK=5, WEEKS_PER_MONTH=4, PER_MONTH=20, TOTAL=L.length;
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

function lvOf(i){return Math.floor(i/20);}
function ptsOf(i){return LEVELS[lvOf(i)].pts;}

/* ===== أدوات ===== */
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var HL=new RegExp('(#.*$)|("[^"]*"|\'[^\']*\')|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:print|if|elif|else|for|while|in|def|return|class|import|from|as|try|except|finally|raise|with|lambda|yield|not|and|or|True|False|None|pass|break|continue|is|assert)\\b)','g');
function hl(code){
  return code.split("\n").map(function(line){
    return esc(line).replace(HL,function(m,c,s,n,k){
      if(c)return '<span class="c">'+c+'</span>';
      if(s)return '<span class="s">'+s+'</span>';
      if(n)return '<span class="n">'+n+'</span>';
      return '<span class="k">'+k+'</span>';
    });
  }).join("\n");
}
function store(op,k,v){try{if(op==="get")return localStorage.getItem(k);if(op==="set")localStorage.setItem(k,v);if(op==="del")localStorage.removeItem(k);}catch(e){}return null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ===== الحالة ===== */
var S={done:{},start:null,view:"home",lesson:0,month:0};
(function load(){
  try{var d=JSON.parse(store("get","asr_py_done")||"{}");if(d&&typeof d==="object")S.done=d;}catch(e){}
  S.start=store("get","asr_py_start")||todayStr();
  store("set","asr_py_start",S.start);
})();
function save(){store("set","asr_py_done",JSON.stringify(S.done));}
function isDone(i){return S.done[i]!==undefined;}
function doneCount(){return Object.keys(S.done).length;}
function points(){var t=0;for(var k in S.done)t+=S.done[k];return t;}
function unlocked(i){return i===0||isDone(i-1)||isDone(i);}
function nextIdx(){for(var i=0;i<TOTAL;i++)if(!isDone(i))return i;return -1;}
function rank(){var r=RANKS[0][1];RANKS.forEach(function(x){if(points()>=x[0])r=x[1];});return r;}
function curWeek(){
  var s=new Date(S.start+"T00:00:00"),n=new Date(todayStr()+"T00:00:00");
  var days=Math.floor((n-s)/86400000);
  var w=Math.floor(days/7)+1;
  return Math.max(1,Math.min(TOTAL/PER_WEEK,w));
}
function weekDone(w){var c=0;for(var i=(w-1)*PER_WEEK;i<w*PER_WEEK;i++)if(isDone(i))c++;return c;}

  h+='<div class="nav"><button class="btn ghost" id="prev" type="button"'+(i===0?' disabled':'')+'>الدرس السابق</button><button class="btn" id="next" type="button" disabled>'+(i===TOTAL-1?'إنهاء الكورس':'الدرس التالي')+'</button></div></article>';
  main.innerHTML=h;

  var opts=document.getElementById("opts"),fb=document.getElementById("fb"),next=document.getElementById("next");
  var correct=l[5][l[6]],attempts=0;
  function lockAll(){opts.querySelectorAll(".opt").forEach(function(x){x.disabled=true;});}
  shuffle(l[5]).forEach(function(txt){
    var b=document.createElement("button");b.type="button";b.className="opt";
    var sp=document.createElement("span");sp.textContent=txt;
    if(/^[\x00-\x7F]+$/.test(txt)){sp.setAttribute("dir","ltr");sp.style.unicodeBidi="embed";sp.style.fontFamily="'Fira Code',ui-monospace,monospace";}
    b.appendChild(sp);
    b.onclick=function(){
      if(txt===correct){
        b.classList.add("right");lockAll();
        if(!isDone(i)){
          var p=attempts===0?full:Math.round(full/2);
          S.done[i]=p;save();header();
          fb.className="fb ok";fb.textContent="صح! +"+p+" نقطة"+(attempts?" (نص النقاط لأنك جاوبت بعد محاولة)":"");
          toast("+"+p+" نقطة ⭐");
          if((i+1)%20===0)setTimeout(function(){toast("خلّصت "+LEVELS[lvOf(i)].n+" 🎉");},2400);
        }
        next.disabled=false;
      }else{
        attempts++;b.classList.add("wrong");b.disabled=true;
        fb.className="fb bad";fb.textContent="مش دي. جرّب تاني.";
      }
    };
    opts.appendChild(b);
  });
  if(isDone(i)){
    var all=opts.querySelectorAll(".opt");
    all.forEach(function(x){if(x.textContent===correct)x.classList.add("right");});
    lockAll();fb.className="fb ok";fb.textContent="خلّصت الدرس ده وخدت "+S.done[i]+" نقطة.";next.disabled=false;
  }
  document.getElementById("prev").onclick=function(){S.lesson=i-1;render();window.scrollTo({top:0,behavior:"smooth"});};
  next.onclick=function(){if(i<TOTAL-1){S.lesson=i+1;render();window.scrollTo({top:0,behavior:"smooth"});}else{go("home");}};
}

function render(){
  header();
  if(S.view==="home")viewHome();
  else if(S.view==="course")viewCourse();
  else if(S.view==="plan")viewPlan();
  else viewLesson();
}

/* ===== ربط الأزرار ===== */
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-v"));};});
var root=document.documentElement,tb=document.getElementById("themeBtn");
var dark=!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(){root.setAttribute("data-theme",dark?"dark":"light");tb.textContent=dark?"الوضع النهاري":"الوضع الليلي";}
tb.onclick=function(){dark=!dark;applyTheme();};applyTheme();
document.getElementById("resetBtn").onclick=function(){
  if(confirm("تمسح كل تقدمك ونقاطك وتبدأ من جديد؟")){S.done={};store("del","asr_py_done");S.start=todayStr();store("set","asr_py_start",S.start);S.month=0;go("home");}
};
render();
</script>
